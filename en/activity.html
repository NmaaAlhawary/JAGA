  .doc small { color: var(--ink-3); }

  }
</style><!--/PAGE_STYLE-->

<script>
  const S = {

          markDone: 'تحديد كمكتمل', isDone: 'تمّ', todo: 'للإنجاز: ', todoT: { Video: 'شاهد الفيديو', Reading: 'اطّلع على المادة', File: 'اطّلع على الملف', Discussion: 'أضف مشاركة', Quiz: 'احصل على علامة', Assignment: 'سلّم الواجب' },

          desc: { Video: 'شاهد الفيديو كاملاً، ودوّن أبرز الأفكار لاستخدامها في نشاطي «تعاون» و«طبّق» ضمن هذه الكتلة.',
                  Reading: 'اقرأ المادة المرفقة بعناية، فهي الأساس المرجعي لأنشطة هذه الكتلة وتقييمها.',
                  File: 'اطّلع على الملف المرفق قبل البدء بأنشطة الوحدة.',

                  Assignment: 'طبّق ما تعلّمته في هذه الكتلة على الحالة المقدّمة، وسلّم عملك بصيغة PDF وفق النموذج المرفق.' },
          kind: { 'Talking Head': 'حديث مباشر', 'Screen Cast': 'شرح على الشاشة', '': 'فيديو' },
          min: 'دقيقة', file: 'ملف PDF · 1.4 MB', open: 'فتح', preview: 'معاينة الاختبار', attempt: 'ابدأ المحاولة', attempts: 'المحاولات المسموحة:', time: 'المدة الزمنية:', mins: 'دقيقة', grade: 'طريقة التقييم: أعلى علامة',
          sub: [['حالة التسليم','لم يتم التسليم بعد'],['حالة التقييم','لم يُقيَّم'],['الوقت المتبقي','13 يوماً و 4 ساعات'],['آخر تعديل','—']], add: 'إضافة تسليم',
          threads: [['م.ع','أهلاً بكم في نقاش هذه الكتلة','د. محمد العلي · منذ يومين','12 رداً'],['ر.ح','تجربة مؤسستنا في هذا الموضوع','م. ريم الحسن · منذ يوم','5 ردود'],['ل.ن','سؤال حول متطلبات التوثيق','أ. لينا النعيمي · منذ 3 ساعات','2 ردّان']], newPost: 'إضافة موضوع نقاش',
          prev: 'النشاط السابق', next: 'النشاط التالي',
          mock: [['index.html','الرئيسية'],['pathways.html','المسارات'],['courses.html','المساقات'],['course.html','داخل المساق (Moodle)']] },
    en: { back: 'Back to Course', me: 'SM', block: 'Block', intro: 'Module introduction', done: 'Done', of: 'of', acts: 'activities',
          markDone: 'Mark as done', isDone: 'Done', todo: 'To do: ', todoT: { Video: 'Watch the video', Reading: 'View the material', File: 'View the file', Discussion: 'Make a post', Quiz: 'Receive a grade', Assignment: 'Make a submission' },
          opened: 'Opened:', due: 'Due:', openD: 'Sunday, 19 October 2026, 9:00 AM', dueD: 'Sunday, 2 November 2026, 11:59 PM',
          tabs: { Quiz: ['Quiz','Settings','Questions','Results','Question bank','More'], Assignment: ['Assignment','Settings','Submissions','More'], Discussion: ['Forum','Settings','Subscriptions','More'], def: ['Activity','Settings','More'] },
          desc: { Video: 'Watch the full video and note the key ideas — you will use them in the Collaborate and Apply activities of this block.',
                  Reading: 'Read the attached material carefully; it is the reference for this block\'s activities and assessment.',
                  File: 'Review the attached file before starting the module activities.',
                  Discussion: 'Share your view and practical experience, and respond constructively to at least two classmates.',
                  Quiz: 'This quiz checks your understanding of the block content. Read each question carefully and choose the best answer.',
                  Assignment: 'Apply what you learned in this block to the provided case and submit your work as a PDF using the attached template.' },
          kind: { 'Talking Head': 'Talking head', 'Screen Cast': 'Screencast', '': 'Video' },
          min: 'min', file: 'PDF file · 1.4 MB', open: 'Open', preview: 'Preview quiz', attempt: 'Attempt quiz', attempts: 'Attempts allowed:', time: 'Time limit:', mins: 'mins', grade: 'Grading method: Highest grade',
          sub: [['Submission status','No submissions have been made yet'],['Grading status','Not graded'],['Time remaining','13 days 4 hours'],['Last modified','—']], add: 'Add submission',

          mock: [['index.html','Home'],['pathways.html','Pathways'],['courses.html','Courses'],['course.html','Inside Course (Moodle)']] },

  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const P = findPathway(q.get('p') || 'ai-digital-practice');

  const M = P.modules[mi];

  const acts = getActivities(P, mi, bi);
  const ai = Math.max(0, Math.min(+(q.get('a') || 0), acts.length - 1));
  const A = acts[ai];
  const T = ACT_TYPES[A.type];
  const url = (b, a) => `activity.html?p=${P.id}&m=${mi}&b=${b}&a=${a}`;

  document.title = `${actTitle(A)} · ${moduleTitle(M)} | JAGA`;

  const groups = [...new Set(acts.map(a => a.k))];

    groups.map(k => `<div class="ci-sec"><button>${t(PHASES[k])}<i data-lucide="chevron-down"></i></button><div class="ci-items">` +

        <a class="ci-item ${i === ai ? 'on' : ''}" href="${url(bi, i)}">

  // main: activity header, tab bar, to-do, dates, description, type-specific content

  } else if (A.type === 'Reading' || A.type === 'File') {
    body = `<div class="doc"><span class="ic"><i data-lucide="file-text"></i></span><div><b>${actTitle(A)}</b><small>${S.file}</small></div><a href="#" class="btn btn-primary btn-sm">${S.open}</a></div>`;
  } else if (A.type === 'Discussion') {
    body = `<div class="threads">${S.threads.map(([av, ti, by, n]) => `<div class="th"><span class="avatar">${av}</span><div><b>${ti}</b><small>${by}</small></div><span class="n">${n}</span></div>`).join('')}</div>
      <a href="#" class="act-btn primary"><i data-lucide="plus"></i> ${S.newPost}</a>`;
  } else if (A.type === 'Quiz') {
    body = `<a href="#" class="act-btn">${S.preview}</a> <a href="#" class="act-btn primary">${S.attempt}</a>
      <ul class="facts"><li>${S.attempts} 1</li><li>${S.time} 30 ${S.mins}</li><li>${S.grade}</li></ul>`;
  } else if (A.type === 'Assignment') {
    body = `<div class="sub-table">${S.sub.map(([k, v]) => `<div><span>${k}</span><span>${v}</span></div>`).join('')}</div><a href="#" class="act-btn primary"><i data-lucide="upload"></i> ${S.add}</a>`;
  }
  const prev = ai > 0 ? acts[ai - 1] : null, next = ai < acts.length - 1 ? acts[ai + 1] : null;
  const chevP = LANG === 'ar' ? 'chevron-right' : 'chevron-left', chevN = LANG === 'ar' ? 'chevron-left' : 'chevron-right';
  $('main').innerHTML = `
    <div class="a-head"><span class="ai lg ${T.tone}"><i data-lucide="${T.icon}"></i></span><div><small>${t(T.label)}${A.v ? ` · ${S.kind[A.v]}` : ''}</small><h1>${actTitle(A)}</h1></div></div>
    <nav class="a-tabs">${tabs.map((x, i) => `<a href="#" class="${i === 0 ? 'on' : ''}">${x}${i === tabs.length - 1 ? ' <i data-lucide="chevron-down"></i>' : ''}</a>`).join('')}</nav>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span class="todo ${doneNow ? 'ok' : ''}"><i data-lucide="${doneNow ? 'check' : 'circle'}"></i> ${doneNow ? S.done : S.todo + S.todoT[A.type]}</span>
      ${A.type === 'Reading' || A.type === 'File' ? `<button class="done-btn ${doneNow ? 'ok' : ''}" id="markBtn"><i data-lucide="${doneNow ? 'check' : 'circle'}"></i> ${doneNow ? S.isDone : S.markDone}</button>` : ''}
    </div>
    ${hasDates ? `<div class="dates"><span><b>${S.opened}</b> ${S.openD}</span><span><b>${S.due}</b> ${S.dueD}</span></div>` : '<div style="height:8px"></div>'}
    <p class="desc">${S.desc[A.type]}</p>
    ${body}
    <div class="pn">
      ${prev ? `<a href="${url(bi, ai - 1)}"><i data-lucide="${chevP}"></i><div><small>${S.prev}</small><b>${actTitle(prev)}</b></div></a>` : '<span></span>'}
      ${next ? `<a class="nx" href="${url(bi, ai + 1)}"><div><small>${S.next}</small><b>${actTitle(next)}</b></div><i data-lucide="${chevN}"></i></a>` : ''}
    </div>`;
  const mb = $('markBtn');
  if (mb) mb.onclick = () => { const ok = mb.classList.toggle('ok'); mb.innerHTML = `<i data-lucide="${ok ? 'check' : 'circle'}"></i> ${ok ? S.isDone : S.markDone}`; lucide.createIcons(); };
  lucide.createIcons();
</script>
</body>
</html>
